# Temporary, on this branch only: asks Open VSX for a trusted publishing token to prove the
# registration. It publishes nothing and never prints the token.
permissions:
  contents: read

name: Publish extension registries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused by this check
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Request a trusted publishing token (nothing is published)
        run: |
          node -e '
            const { Registry } = require("./node_modules/ovsx/lib/registry");
            const { getTrustedPublishingToken } = require("./node_modules/ovsx/lib/trusted-publishing");
            getTrustedPublishingToken(new Registry({}), "thalovant", "thalovant-skills", {})
              .then((token) => { if (!token) throw new Error("empty token"); console.log("Trusted publisher registration works."); })
              .catch((error) => { console.error(error.message); process.exit(1); });
          '
